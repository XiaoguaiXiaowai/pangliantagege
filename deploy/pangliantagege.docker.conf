# ============================================================
# 主站 www.pangliantagege.top — Docker 容器反代配置
# 部署位置: /etc/nginx/sites-available/pangliantagege.docker.conf
# 反代目标: pltgg-frontend 容器 (127.0.0.1:8080)
#
# 架构说明：
#   宿主机 nginx 是唯一 80/443 入口（共享网关），
#   playground (aep-playground.conf) 与本配置并行，互不影响。
#   /api/chat（RAG 动态 IP）按需求暂不代理。
# ============================================================

# 80 端口统一跳转
server {
    listen 80;
    server_name www.pangliantagege.top;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name pangliantagege.top;
    return 301 https://www.pangliantagege.top$request_uri;
}

# 主站 HTTPS
server {
    listen 443 ssl http2;
    server_name www.pangliantagege.top;

    ssl_certificate     /var/pltgg/https/www.pangliantagege.top.pem;
    ssl_certificate_key /var/pltgg/https/www.pangliantagege.top.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 允许较大上传（图片/音视频）
    client_max_body_size 20M;

    # API 限流（zone 定义见 /etc/nginx/conf.d/pltgg_ratelimit.conf）
    location ^~ /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其余全部转发给前端容器（静态页 /media /static /admin 由容器内 nginx 处理）
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 主域名 https -> www 跳转
server {
    listen 443 ssl http2;
    server_name pangliantagege.top;

    ssl_certificate     /var/pltgg/https/pangliantagege.top.pem;
    ssl_certificate_key /var/pltgg/https/pangliantagege.top.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    return 301 https://www.pangliantagege.top$request_uri;
}
