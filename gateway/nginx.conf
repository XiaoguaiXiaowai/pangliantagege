# ============================================================
# 共享网关 Nginx 配置（挂载为容器内 /etc/nginx/conf.d/default.conf）
#
# 本项目（www.pangliantagege.top）+ 第二个项目共用同一套 80/443
# 入口与 HTTPS 证书。第二个项目接入时按文末模板添加 server 块即可。
# ============================================================

# 全局限流区：/api 接口 30 次/分钟
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;

# Docker 内置 DNS：让 proxy_pass 在请求时动态解析容器名，
# 避免"网关先启动、后端项目后启动"时 nginx 解析失败
resolver 127.0.0.11 valid=10s ipv6=off;

# ---------------- 80 端口统一跳转 HTTPS ----------------
server {
    listen 80;
    server_name www.pangliantagege.top pangliantagege.top;

    return 301 https://$host$request_uri;
}

# ---------------- 主站 HTTPS：www.pangliantagege.top ----------------
server {
    listen 443 ssl;
    http2 on;
    server_name www.pangliantagege.top;

    ssl_certificate     /etc/nginx/https/www.pangliantagege.top.pem;
    ssl_certificate_key /etc/nginx/https/www.pangliantagege.top.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 允许较大上传（图片/音视频）
    client_max_body_size 20M;

    # API 接口限流（与 deploy.sh 行为一致）
    location ^~ /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        set $pltgg_upstream http://pltgg-frontend;
        proxy_pass $pltgg_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其余全部转发给本项目前端容器（nginx: 静态页面 + 反代 /admin /media /static）
    location / {
        set $pltgg_upstream http://pltgg-frontend;
        proxy_pass $pltgg_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------- 主域名 pangliantagege.top -> www 跳转 ----------------
server {
    listen 443 ssl;
    http2 on;
    server_name pangliantagege.top;

    ssl_certificate     /etc/nginx/https/pangliantagege.top.pem;
    ssl_certificate_key /etc/nginx/https/pangliantagege.top.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    return 301 https://www.pangliantagege.top$request_uri;
}

