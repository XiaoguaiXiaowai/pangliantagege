#          edge-net:
#            external: true
#      （服务里声明 networks: [edge-net]，或同时挂自己的内部网络）
#   2. 在下面按模板添加 server 块，proxy_pass 指向该项目的
#      容器名/网络别名（容器需与 gateway 同在 edge-net 网络）
