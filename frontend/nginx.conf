# ============================================================
# PangLianTaGeGe 前端 Nginx 配置（容器内）
# 职责：
#   1. 托管 Vue 构建产物（SPA）
#   2. 直接服务 /media/ 与 /static/（宿主机挂载目录，与 deploy.sh 行为一致）
#   3. 反代 /api/ 与 /admin/ 到后端容器 pltgg-backend:8000
# 本容器不对外暴露端口，由共享网关 (gateway/) 统一接入。
# ============================================================

# 转发协议头：网关（gateway/）已传 https 时保留原值，
# 直接访问（无该头）时回退到本机 $scheme —— 保证 Django 的
# SECURE_SSL_REDIRECT / Secure Cookie 判断正确
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 允许较大上传（图片/音视频）
    client_max_body_size 20M;

    # 用户上传的媒体文件（宿主机 ./backend/media 只读挂载到 /var/www/media）
    location /media/ {
        alias /var/www/media/;
        autoindex off;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Django 静态文件（admin CSS/JS，collectstatic 产物挂载到 /var/www/static）
    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 30d;
    }

    # 后台管理入口归一化：/admin（无斜杠）→ /admin/，避免被下方 SPA 兜底吞掉
    location = /admin {
        return 301 /admin/;
    }

    # API 与后台管理反代到 Django（匹配带或不带尾部斜杠的其他路径）
    location ~ ^/(api|admin)(/|$) {
        proxy_pass http://pltgg-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # 【可选】AI 聊天代理：接入 RAG 服务时取消注释，
    # 并把 RAG_PROXY_TARGET 换成实际地址（例：http://192.168.1.100:8001）
    # location ^~ /api/chat {
    #     proxy_pass http://192.168.1.100:8001;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # SPA 前端路由兜底
    location / {
        try_files $uri $uri/ /index.html;
    }
}
